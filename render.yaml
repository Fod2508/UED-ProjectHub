services:
  - type: web
    name: ued-projecthub
    env: node
    plan: free
    region: singapore # hoặc oregon / frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
