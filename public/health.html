<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UED-ProjectHub • Service Health</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .pulse-dot {
      width: 12px;
      height: 12px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      background: #ecfdf5;
      color: #047857;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid #a7f3d0;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 6px 0;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 13px;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    .meta-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #475569;
      text-align: left;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .meta-row:last-child { margin-bottom: 0; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      HEALTHY • 200 OK
    </div>
    <h1>UED-ProjectHub</h1>
    <p>Hệ thống Quản lý Đồ án Môn học<br>Khoa CNTT - Trường ĐH Sư phạm, ĐH Đà Nẵng</p>

    <div class="meta-box">
      <div class="meta-row">
        <span class="label">Status:</span>
        <span class="value" style="color: #059669;">ONLINE</span>
      </div>
      <div class="meta-row">
        <span class="label">Health Check:</span>
        <span class="value">Active</span>
      </div>
      <div class="meta-row">
        <span class="label">Cron Keep-Alive:</span>
        <span class="value">Ready</span>
      </div>
    </div>
  </div>
</body>
</html>
